<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio de Desenvolvedor Full-stack. Produtos digitais, sites e plataformas com design moderno."
    />
    <title>Dafa | Full-stack Developer</title>
    <script>
      ;(function () {
        var stored = localStorage.getItem('dafa-theme')
        var dark =
          stored === null
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
            : stored === 'dark'
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
